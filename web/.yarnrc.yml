approvedGitRepositories:
  - "**"

compressionLevel: 0

defaultSemverRangePrefix: ""

enableGlobalCache: false

enableMirror: false

enableScripts: true

nmMode: hardlinks-local

nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - current
  libc:
    - current
  os:
    - current
