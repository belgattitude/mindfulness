packages:
  - strapi
  - web

nodeLinker: isolated
packageImportMethod: auto
savePrefix: ''

# uncomment the autodedupe and lockfile.includeResolutionSettings
# when turbo repo prune supports the settings entry in pnpm lock
#autoDedupe: true
#lockfile:
#  includeResolutionSettings: true
autoInstallPeers: false
strictPeerDependencies: false
resolvePeersFromWorkspaceRoot: true
dedupePeers: true
# This fixes most typescript errors because of missing peer @types/*
addMissingPeerTypes: true

forceIgnoresPlatform: false
ignoreCompatibilityDb: true

# Set it to true for deno
preferSymlinkedExecutables: true
resolutionMode: highest
optimisticRepeatInstall: true

trustPolicy: no-downgrade
trustPolicyExcludePrune: true
# Older releases published before the package adopted provenance / trusted
# publishing (same publisher), reviewed one by one
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'react-redux@8.1.3'

verifyDepsBeforeRun: install

# pnpm 12.9.1 has an issue still that makes every run command
# running postinstall scripts, even id virtualStoreType is project
enableGlobalVirtualStore: false
#https://github.com/pnpm/pnpm/issues/14972
virtualStoreType: project

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  # better-sqlite3 13 ships prebuilt binaries (including musl), its node-gyp
  # build would require python and a compiler (ie: alpine docker images)
  better-sqlite3: false
  esbuild: true
  # Not needed: version check, funding message, native binding load check
  '@apollo/protobufjs': false
  core-js-pure: false
  '@swc/core': false

strictDepBuilds: false

overrides:
  sharp: 0.35.5

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  # Strapi pins its own packages to exact versions
  - '@strapi/*'
  - '@httpx/*'
  - '@next/*'
  - '@oxc-project/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@vitejs/*'
  - next
  - oxfmt
  - oxlint
  - vite
  - vitest
  - zod
  - npm-check-updates@23.1.1
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'

permissions:
  ultracite:
    skills: true

skills:
  dirs:
    - .claude/skills