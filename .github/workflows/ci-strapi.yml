name: CI-strapi

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: ['node@24']
    defaults:
      run:
        shell: bash
        working-directory: strapi

    steps:
      - uses: actions/checkout@v6

      # pnpm version from devEngines.packageManager in the root package.json,
      # then `pnpm install` of the workspace
      - name: ⚙️ Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: ${{ matrix.runtime }}
          cache: true
          node-version-file: false
          require-lockfile: true

      - name: Typecheck scripts
        run: pnpm typecheck

      - name: Build strapi
        run: pnpm build
        env:
          DATABASE_FILENAME: data/mindfulness.sqlite.db
