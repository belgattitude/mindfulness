name: CI-web

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: ['node@24']
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      # pnpm version from devEngines.packageManager in the root package.json,
      # then `pnpm install` of the workspace
      - name: ⚙️ Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: ${{ matrix.runtime }}
          cache: true
          node-version-file: false
          require-lockfile: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test-unit

      - name: Build nextjs
        run: pnpm build
        env:
          NEXTJS_IGNORE_TYPECHECK: true
          NEXT_DISABLE_SOURCEMAPS: true
          NEXT_TELEMETRY_DISABLED: true
